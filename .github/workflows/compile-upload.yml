name: Compile CV and Upload to Drive

on:
  push:
    branches: [main]
    paths:
      - 'cv/**.tex'
  workflow_dispatch: # Memungkinkan trigger manual

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv/

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Setup rclone config
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: Upload PDF to Google Drive
        run: |
          rclone copyto cv/cv.pdf "gdrive:CV-Farhan-Raditya-Aji.pdf" --drive-root-folder-id "${{ secrets.GDRIVE_FOLDER_ID }}"
